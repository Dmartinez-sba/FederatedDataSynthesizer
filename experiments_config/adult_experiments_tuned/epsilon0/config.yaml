data_path: ./data/adult_complete.csv
dataset_name: adult
local: True
data_synthesizer:
    threshold_value: 15
    categorical_attributes:
        - workclass
        - education-num 
        - marital-status
        - occupation 
        - relationship
        - race
        - sex
        - native-country
        - income
    candidate_keys: []
    target: 'income'
aggregation_type: 'frequencies'
threshold: 15
epochs: 800
n_splits: 3
seed: 0
target: income
genetic_algorithm:
    source_genes: 10
    genepool_size: 100
    aggregation_interval: 20
    epsilon: 0
    degree_of_bayesian_network: 3
federated_learning:
    number_of_clients: 3
    scenario: 'iid'

